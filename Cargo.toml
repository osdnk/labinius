[workspace]
resolver = "2"
members = [
    "crates/bench",
    "crates/binius",
    "crates/competitors",
    "crates/flock",
    "crates/pcs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
labinius = { path = "crates/pcs" }
labinius-bench = { path = "crates/bench" }
# Fiat-Shamir transcript (challenge.rs): blake3 as the hash and the XOF.
blake3 = "1.8"
# binius64 instruments its phases with tracing spans; the baseline column reads them.
tracing = "0.1"
# Flock's proof parts are serde types; bincode measures them on the wire.
serde = "1"
bincode = "1.3"
# Binius64 upstream.
binius-hash = { git = "https://github.com/IrreducibleOSS/binius64", rev = "81cdfff40cb21746581df0b5ea34eaf1761bc82f" }
binius-core = { git = "https://github.com/IrreducibleOSS/binius64", rev = "81cdfff40cb21746581df0b5ea34eaf1761bc82f" }
binius-circuits = { git = "https://github.com/IrreducibleOSS/binius64", rev = "81cdfff40cb21746581df0b5ea34eaf1761bc82f" }
binius-frontend = { git = "https://github.com/IrreducibleOSS/binius64", rev = "81cdfff40cb21746581df0b5ea34eaf1761bc82f" }
binius-field = { git = "https://github.com/IrreducibleOSS/binius64", rev = "81cdfff40cb21746581df0b5ea34eaf1761bc82f" }
binius-math = { git = "https://github.com/IrreducibleOSS/binius64", rev = "81cdfff40cb21746581df0b5ea34eaf1761bc82f" }
binius-compute = { git = "https://github.com/IrreducibleOSS/binius64", rev = "81cdfff40cb21746581df0b5ea34eaf1761bc82f" }
binius-transcript = { git = "https://github.com/IrreducibleOSS/binius64", rev = "81cdfff40cb21746581df0b5ea34eaf1761bc82f" }
binius-ip = { git = "https://github.com/IrreducibleOSS/binius64", rev = "81cdfff40cb21746581df0b5ea34eaf1761bc82f" }
binius-ip-prover = { git = "https://github.com/IrreducibleOSS/binius64", rev = "81cdfff40cb21746581df0b5ea34eaf1761bc82f" }
binius-iop = { git = "https://github.com/IrreducibleOSS/binius64", rev = "81cdfff40cb21746581df0b5ea34eaf1761bc82f" }
binius-iop-prover = { git = "https://github.com/IrreducibleOSS/binius64", rev = "81cdfff40cb21746581df0b5ea34eaf1761bc82f" }
binius-prover = { git = "https://github.com/IrreducibleOSS/binius64", rev = "81cdfff40cb21746581df0b5ea34eaf1761bc82f" }
binius-verifier = { git = "https://github.com/IrreducibleOSS/binius64", rev = "81cdfff40cb21746581df0b5ea34eaf1761bc82f" }
# binius64 before "Remove all WHIR code" (0fcb7f21): the WHIR column keeps that pin.
binius-compute-whir = { package = "binius-compute", git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-core-whir = { package = "binius-core", git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-hash-whir = { package = "binius-hash", git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-iop-whir = { package = "binius-iop", git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-iop-prover-whir = { package = "binius-iop-prover", git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-ip-whir = { package = "binius-ip", git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-ip-prover-whir = { package = "binius-ip-prover", git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-math-whir = { package = "binius-math", git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-prover-whir = { package = "binius-prover", git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-transcript-whir = { package = "binius-transcript", git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-verifier-whir = { package = "binius-verifier", git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
# Ligerito as Flock ports it, over F128, with the ring switch above it.
flock-core = { git = "https://github.com/succinctlabs/flock", rev = "b684b1258e4b1f202bec24afd660ace851b09e5e" }
# Flock as the second PIOP: its hash R1CS and reductions, this crate's commitment beneath them.
flock-field = { git = "https://github.com/succinctlabs/flock", rev = "b684b1258e4b1f202bec24afd660ace851b09e5e" }
flock-transcript = { git = "https://github.com/succinctlabs/flock", rev = "b684b1258e4b1f202bec24afd660ace851b09e5e" }
flock-prover = { git = "https://github.com/succinctlabs/flock", rev = "b684b1258e4b1f202bec24afd660ace851b09e5e" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
panic = "abort"
overflow-checks = false

[profile.dev]
opt-level = 1

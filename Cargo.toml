[workspace]
resolver = "2"
members = [
    "crates/bench",
    "crates/binius",
    "crates/competitors",
    "crates/flock",
    "crates/pcs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
bin-ntt = { path = "crates/pcs" }
bin-ntt-bench = { path = "crates/bench" }
# Fiat-Shamir transcript (challenge.rs): blake3 as the hash and the XOF.
blake3 = "1.8"
# binius64 instruments its phases with tracing spans; the baseline column reads them.
tracing = "0.1"
# Flock's proof parts are serde types; bincode measures them on the wire.
serde = "1"
bincode = "1.3"
# Binius64 upstream.
binius-hash = { git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-core = { git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-circuits = { git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-frontend = { git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-field = { git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-math = { git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-compute = { git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-transcript = { git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-ip = { git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-ip-prover = { git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-iop = { git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-iop-prover = { git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-prover = { git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
binius-verifier = { git = "https://github.com/IrreducibleOSS/binius64", rev = "37e9cd64e82243cde0e79c7d8ac0dc319f1cbeb4" }
# Ligerito as Flock ports it, over F128, with the ring switch above it.
flock-core = { git = "https://github.com/succinctlabs/flock", rev = "a4a0b4a9dd555f9b58853951c133d7c990af5dad" }
# Flock as the second PIOP: its hash R1CS and reductions, this crate's commitment beneath them.
flock-field = { git = "https://github.com/succinctlabs/flock", rev = "a4a0b4a9dd555f9b58853951c133d7c990af5dad" }
flock-transcript = { git = "https://github.com/succinctlabs/flock", rev = "a4a0b4a9dd555f9b58853951c133d7c990af5dad" }
flock-prover = { git = "https://github.com/succinctlabs/flock", rev = "a4a0b4a9dd555f9b58853951c133d7c990af5dad" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
panic = "abort"
overflow-checks = false

[profile.dev]
opt-level = 1

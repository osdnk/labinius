[package]
default-run = "bin-ntt"
name = "bin-ntt"
version = "0.1.0"
edition = "2021"
description = "AVX-512 Ajtai commitment, fold and verifier over Z_q[X]/(X^648 - X^324 + 1) (conductor 1944 = 2^3 * 3^5) for binary inputs, over the limbs q in {2917, 3889, 4861, 9721, 12637, 17497, 19441}"

[dependencies]
# Fiat-Shamir transcript (challenge.rs): blake3 as the hash and the XOF.
blake3 = "1.8"
# binius64 instruments its phases with tracing spans; the baseline column reads them.
tracing = "0.1"
# Binius64 upstream.
binius-hash = { git = "https://github.com/IrreducibleOSS/binius64", rev = "b3caccf0a5dd705c0150d52c8e4c9e2aa4f28c9f" }
binius-core = { git = "https://github.com/IrreducibleOSS/binius64", rev = "b3caccf0a5dd705c0150d52c8e4c9e2aa4f28c9f" }
binius-circuits = { git = "https://github.com/IrreducibleOSS/binius64", rev = "b3caccf0a5dd705c0150d52c8e4c9e2aa4f28c9f" }
binius-frontend = { git = "https://github.com/IrreducibleOSS/binius64", rev = "b3caccf0a5dd705c0150d52c8e4c9e2aa4f28c9f" }
binius-field = { git = "https://github.com/IrreducibleOSS/binius64", rev = "b3caccf0a5dd705c0150d52c8e4c9e2aa4f28c9f" }
binius-math = { git = "https://github.com/IrreducibleOSS/binius64", rev = "b3caccf0a5dd705c0150d52c8e4c9e2aa4f28c9f" }
binius-compute = { git = "https://github.com/IrreducibleOSS/binius64", rev = "b3caccf0a5dd705c0150d52c8e4c9e2aa4f28c9f" }
binius-transcript = { git = "https://github.com/IrreducibleOSS/binius64", rev = "b3caccf0a5dd705c0150d52c8e4c9e2aa4f28c9f" }
binius-ip = { git = "https://github.com/IrreducibleOSS/binius64", rev = "b3caccf0a5dd705c0150d52c8e4c9e2aa4f28c9f" }
binius-ip-prover = { git = "https://github.com/IrreducibleOSS/binius64", rev = "b3caccf0a5dd705c0150d52c8e4c9e2aa4f28c9f" }
binius-iop = { git = "https://github.com/IrreducibleOSS/binius64", rev = "b3caccf0a5dd705c0150d52c8e4c9e2aa4f28c9f" }
binius-iop-prover = { git = "https://github.com/IrreducibleOSS/binius64", rev = "b3caccf0a5dd705c0150d52c8e4c9e2aa4f28c9f" }
binius-prover = { git = "https://github.com/IrreducibleOSS/binius64", rev = "b3caccf0a5dd705c0150d52c8e4c9e2aa4f28c9f" }
binius-verifier = { git = "https://github.com/IrreducibleOSS/binius64", rev = "b3caccf0a5dd705c0150d52c8e4c9e2aa4f28c9f" }
# Ligerito as Flock ports it, over F128, with the ring switch above it.
flock-core = { git = "https://github.com/succinctlabs/flock", rev = "4ae92adf7c726ae78309a2377c2f78cb95eb7562" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
panic = "abort"
overflow-checks = false

[profile.dev]
opt-level = 1

[features]
sizes = []
sizem = []
sizel = []
labrador = []
[package]
name = "bin-ntt"
version = "0.1.0"
edition = "2021"
description = "AVX-512 NTT over Z_q[X]/(X^648 - X^324 + 1) (conductor 1944 = 2^3 * 3^5) for binary inputs, q in {3889, 9721}"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
panic = "abort"
overflow-checks = false

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 1

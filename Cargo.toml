[package]
name = "bin-ntt"
version = "0.1.0"
edition = "2021"
description = "AVX-512 Ajtai commitment, fold and verifier over Z_q[X]/(X^648 - X^324 + 1) (conductor 1944 = 2^3 * 3^5) for binary inputs, over the limbs q in {2917, 3889, 4861, 9721, 12637}"

[dependencies]
# The F162 type exactly as used by binius64-f162 (pinned to the revision that repo resolves to).
bin-fields = { git = "https://github.com/osdnk/field-benches", rev = "84ee9ce" }
# Fiat-Shamir transcript (challenge.rs): blake3 as the hash and the XOF.
blake3 = "1.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
panic = "abort"
overflow-checks = false

[profile.dev]
opt-level = 1
